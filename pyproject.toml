[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artisan"
version = "2.0.0"
description = "The Autonomous Operating System & Craftsmanship Protocol for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Artisan Open Source Project" }]
keywords = ["ai", "agents", "craftsmanship", "zero-babysitting", "mcp", "cursor", "claude", "quality-gate", "autonomous"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
artisan = "artisan_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src", "src/sdk", "mcp", "scripts"]
addopts = "-v --tb=short"

[tool.pyright]
extraPaths = [".", "src", "src/sdk", "mcp", "scripts"]
include = ["src", "mcp", "tests", "scripts", "cli"]

